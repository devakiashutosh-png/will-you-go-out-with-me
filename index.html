<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Go Out With Me? 💘</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  @keyframes floaty {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-15px); }
  }

  @keyframes heartRain {
    0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
  }

  @keyframes confettiSide {
    0% { transform: translateX(0) rotate(0deg); opacity: 1; }
    100% { transform: translateX(var(--tx)) rotate(var(--rot)) scale(0); opacity: 0; }
  }

  @keyframes popIn {
    0% { transform: scale(0); }
    70% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  body {
    min-height: 100vh;
    font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
    background: radial-gradient(circle at 20% 20%, #ffb6d9, #ff97c8 40%, #ff6fae);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .falling-heart {
    position: fixed;
    top: 0;
    font-size: 24px;
    animation: heartRain linear infinite;
    pointer-events: none;
    user-select: none;
  }

  .card {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(6px);
    border-radius: 40px;
    padding: 48px 40px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(186, 30, 90, 0.45);
    max-width: 620px;
    width: 90%;
    animation: popIn 0.6s ease-out;
    border: 5px dashed #ff89c2;
  }

  h1 {
    font-size: clamp(24px, 5vw, 42px);
    color: #d6336c;
    text-shadow: 2px 2px 0 #ffffff;
    margin-bottom: 40px;
    animation: floaty 3s ease-in-out infinite;
  }

  .bear {
    font-size: clamp(70px, 15vw, 120px);
    animation: floaty 2.5s ease-in-out infinite;
    display: inline-block;
    margin-bottom: 16px;
  }

  .buttons {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 30px;
    flex-wrap: wrap;
    min-height: 140px;
    margin-top: 12px;
  }

  button {
    font-family: inherit;
    font-size: 26px;
    font-weight: bold;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    padding: 16px 34px;
    text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.15);
  }

  #yesBtn {
    background: linear-gradient(135deg, #ff4d8d, #ff7eb3);
    color: white;
    box-shadow: 0 8px 20px rgba(255, 77, 141, 0.5);
    font-size: 28px;
  }

  #yesBtn:hover {
    transform: scale(1.1);
  }

  #noBtn {
    background: #e8e8e8;
    color: #666;
    font-size: 20px;
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.15);
  }

  #noBtn:hover {
    transform: scale(0.95);
  }

  .margin-left {
    margin-left: 8px;
  }

  #result {
    display: none;
    font-size: clamp(30px, 6vw, 54px);
    color: #ff2975;
    margin-top: 20px;
    animation: popIn 0.5s ease-out;
    text-shadow: 2px 2px 0 #ffffff;
  }

  .hidden-extra { display: none; }

  .boy {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1.1;
    font-size: 34px;
    animation: floaty 2.8s ease-in-out infinite;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
  }

  .boy-flowers {
    position: absolute;
    right: -46px;
    top: 18%;
    font-size: 34px;
    transform: rotate(-14deg);
    animation: floaty 2.2s ease-in-out infinite;
  }

  @media (max-width: 480px) {
    .boy { font-size: 26px; }
    .boy-flowers { right: -34px; font-size: 26px; }
  }
</style>
</head>
<body>

  <div id="hearts"></div>

  <div class="card">
    <div class="bear" id="bear">🧸</div>
    <h1>Will you go out with me? 💖🥺👉👈</h1>
    <div class="buttons">
      <div class="boy" id="boy">
        <div>👦</div>
        <div>👕</div>
        <div>👖</div>
        <div>👟</div>
        <div class="boy-flowers">💐</div>
      </div>
      <button id="yesBtn">YES 😍💕</button>
      <button id="noBtn">no 🙅‍♀️</button>
    </div>
    <div id="result">I KNEW IT! 🎉💍💘</div>
  </div>

<script>
  const yesBtn = document.getElementById('yesBtn');
  const noBtn = document.getElementById('noBtn');
  const result = document.getElementById('result');
  const bear = document.getElementById('bear');

  let yesScale = 1;
  let noClicks = 0;

  const noTexts = [
    'no 🙅‍♀️',
    'really? sure? 🥺',
    'are you SURE? 😢',
    'think again!! 🤨',
    'please? 🥹',
    'PRETTY PLEASE? 🙏💖',
    'come onnnn 🥺👉👈',
    'my heart is breaking 💔',
    'this is your last chance... 👀'
  ];

  noBtn.addEventListener('click', () => {
    noClicks++;
    yesScale += 0.35;
    yesBtn.style.transform = `scale(${yesScale})`;

    if (noClicks < noTexts.length) {
      noBtn.textContent = noTexts[noClicks];
    } else {
      noBtn.textContent = 'no 🙅‍♀️';
      noClicks = 0;
    }

    const noPhrases = ['😠 no!', 'nope! 🙃', 'thats wrong ⛔'];
    noBtn.style.fontSize = Math.max(12, 20 - noClicks * 1.5) + 'px';

    const yesPhrases = ['HELL YEAH best choice 🔥', 'of course!! 🎀', 'let\'s gooo ✨', 'Absolutely 💘'];
    maybeShowFloat(yesBtn, yesPhrases);
  });

  yesBtn.addEventListener('click', () => {
    bear.textContent = '🥰';
    document.querySelector('h1').innerText = 'YAYY 💖😍💍';
    result.style.display = 'block';
    yesBtn.style.animation = 'popIn 0.4s ease-out';
    noBtn.disabled = true;
    noBtn.style.opacity = '0.4';
    noBtn.style.cursor = 'not-allowed';
    document.getElementById('boy').style.animation = 'floaty 0.3s ease-in-out 8';
    makeItRain();
  });

  function maybeShowFloat(target, phrases) {
    const existing = target.querySelector('.float-msg');
    if (existing) existing.remove();
    const span = document.createElement('span');
    span.className = 'float-msg margin-left';
    span.textContent = phrases[Math.floor(Math.random() * phrases.length)];
    span.style.cssText = 'font-size:14px;color:#ff5fa2;vertical-align:middle;';
    target.appendChild(span);
  }

  function makeItRain() {
    // Heart rain from top
    for (let i = 0; i < 40; i++) {
      setTimeout(() => {
        const h = document.createElement('span');
        h.className = 'falling-heart';
        h.textContent = ['❤️', '💖', '💘', '💝', '🌸', '💋'][Math.floor(Math.random() * 6)];
        h.style.left = Math.random() * 100 + 'vw';
        h.style.fontSize = (18 + Math.random() * 30) + 'px';
        h.style.animationDuration = (2 + Math.random() * 3.5) + 's';
        document.getElementById('hearts').appendChild(h);
        setTimeout(() => h.remove(), 6000);
      }, i * 80);
    }

    // Confetti blast from sides
    const confettiEmojis = ['🎉', '🎊', '✨', '💖', '💕', '🌸', '💘', '🎀', '💝', '❤️'];
    for (let side = 0; side < 2; side++) {
      for (let i = 0; i < 30; i++) {
        setTimeout(() => {
          const c = document.createElement('span');
          c.style.cssText = `
            position: fixed;
            top: ${40 + Math.random() * 20}vh;
            ${side === 0 ? 'left: -5vw' : 'right: -5vw'};
            font-size: ${20 + Math.random() * 24}px;
            pointer-events: none;
            user-select: none;
            z-index: 9999;
            animation: confettiSide ${0.8 + Math.random() * 0.6}s ease-out forwards;
            --tx: ${side === 0 ? (60 + Math.random() * 40) : -(60 + Math.random() * 40)}vw;
            --rot: ${(Math.random() - 0.5) * 720}deg;
          `;
          c.textContent = confettiEmojis[Math.floor(Math.random() * confettiEmojis.length)];
          document.body.appendChild(c);
          setTimeout(() => c.remove(), 2000);
        }, i * 30);
      }
    }
  }
</script>
</body>
</html>
